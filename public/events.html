<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EquaNova - Events</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation -->
  <nav>
    <div class="logo">EquaNova</div>

    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/events">Events</a></li>
    </ul>

    <div class="auth-buttons">
      <a href="login.html" class="btn primary-btn">Log In</a>
      <a href="signup.html" class="btn secondary-btn">Sign Up</a>
    </div>
  </nav>

  <!-- Events Section -->
  <section class="events-section">
    <h2>Explore Global Opportunities</h2>
    <p>Turn opportunities into real journeys 🌍</p>

    <div id="programs" class="cards"></div>
  </section>

  <!-- JavaScript to fetch and display program(s) -->
  <script>
  const BASE_URL = "https://platform-5yxz.onrender.com";
  const API_URL = `${BASE_URL}/api/programs`;

  function getTag(type) {
    if (!type) return "internship";
    return type.toLowerCase();
  }

  async function loadPrograms() {
    const container = document.getElementById("programs");

    try {
      const response = await fetch(API_URL);
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      const programs = await response.json();

      const params = new URLSearchParams(window.location.search);
      const type = params.get("type");

      const filtered = type
        ? programs.filter(p => p.type === type)
        : programs;

      if (filtered.length === 0) {
        container.innerHTML = "<p>No programs found.</p>";
        return;
      }

      filtered.forEach(p => {
        const card = document.createElement("div");
        card.className = "program-card";

        card.innerHTML = `
          <span class="tag ${getTag(p.type)}">${(p.type || "INTERNSHIP").toUpperCase()}</span>

          <h3>${p.name || p.title || "Untitled Program"}</h3>

          <p class="description">
            ${p.description ? p.description.substring(0, 120) + "..." : "No description available"}
          </p>

          <p>📍 ${p.country || "Global"}</p>
          <p>🏢 ${p.provider || "Unknown provider"}</p>
          <p>⏳ ${p.deadline ? new Date(p.deadline).toLocaleDateString() : "No deadline"}</p>

          <div class="card-actions">
            <a href="${p.website || p.source?.sourceUrl || "#"}" target="_blank">
              View Details
            </a>

            <a href="#" class="cta-btn">✈️ Plan My Trip</a>
          </div>
        `;

        container.appendChild(card);
      });

    } catch (err) {
      console.error(err);
      container.innerHTML =
        `<p style="color:red">Failed to load programs</p>`;
    }
  }

  loadPrograms();
</script>

</body>
</html>
